<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="100%" height="100%">
  <defs>
    <filter id="fluteGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- NST SITTING KRISHNA AS ABSTRACT LETTER 'N' -->
  <g transform="translate(20, 25)">
    <!-- Film Reel Thought Bubble (Represents STUDIO) -->
    <g transform="translate(95, 30)">
      <!-- Pointer to head -->
      <polygon points="12,38 0,50 20,44" fill="#FFFFFF" />
      <!-- Reel Body -->
      <circle cx="26" cy="22" r="24" fill="#FFFFFF" />
      <!-- Film reel holes -->
      <circle cx="26" cy="22" r="4.5" fill="#1E1E1E" />
      <circle cx="26" cy="8" r="4.2" fill="#1E1E1E" />
      <circle cx="39" cy="17" r="4.2" fill="#1E1E1E" />
      <circle cx="34" cy="32" r="4.2" fill="#1E1E1E" />
      <circle cx="18" cy="32" r="4.2" fill="#1E1E1E" />
      <circle cx="13" cy="17" r="4.2" fill="#1E1E1E" />
    </g>

    <!-- Stylized Head with Feather Crown (Peacock motif) -->
    <path d="M 172 56 Q 192 46 206 58 L 186 92 L 172 84 Z" fill="#FFFFFF" />
    <path d="M 178 54 C 170 46 160 50 157 58 C 164 58 170 56 178 54 Z" fill="#FFFFFF" />

    <!-- Red Flute (The emotional core of identity — storytelling, connection & creative energy) -->
    <polygon points="100,138 206,90 209,93 103,142" fill="#FF2222" filter="url(#fluteGlow)" />
    <!-- Tassel / Hanging thread from flute -->
    <path d="M 115 137 L 112 158 M 117 138 L 122 156" stroke="#FF2222" stroke-width="2.5" stroke-linecap="round" />

    <!-- Arms & Hands -->
    <path d="M 182 104 L 148 130 L 157 137 L 180 118 Z" fill="#FFFFFF" />
    <path d="M 164 125 L 132 142 L 142 153 L 170 135 Z" fill="#FFFFFF" />

    <!-- Torso (Forming diagonal stroke of 'N') -->
    <polygon points="186,100 202,146 176,160 166,114" fill="#FFFFFF" />

    <!-- Sitting Legs (Forming base of Letter 'N') -->
    <polygon points="166,156 132,210 144,217 178,168" fill="#FFFFFF" />
    <polygon points="178,160 230,194 222,204 168,172" fill="#FFFFFF" />
    <polygon points="132,210 102,230 112,235 144,217" fill="#FFFFFF" />
    <polygon points="230,194 260,230 248,235 220,202" fill="#FFFFFF" />

    <!-- Jagged Stone Base -->
    <polygon points="90,234 130,226 170,234 210,216 250,234 270,240 255,250 190,245 130,254 80,244" fill="#FFFFFF" />

    <!-- Loyal Dog Companion -->
    <g transform="translate(60, 178)">
      <path d="M 26 26 C 28 18 36 16 42 20 C 47 23 51 30 45 33 C 41 36 37 33 33 38 L 28 44 Z" fill="#FFFFFF" />
      <path d="M 26 22 L 20 16 L 24 24 Z" fill="#FFFFFF" />
      <path d="M 30 40 C 23 43 13 50 16 60 C 20 70 30 68 40 64 C 34 58 36 50 42 46 Z" fill="#FFFFFF" />
      <path d="M 14 56 C 6 50 2 42 6 38 C 10 36 13 40 14 46 Z" fill="#FFFFFF" />
    </g>
  </g>

  <!-- TYPOGRAPHY LOCKUP -->
  <g transform="translate(340, 40)">
    <!-- "NST" in haute elegance high-contrast serif -->
    <text x="0" y="145" font-family="'Clash Display', 'Cormorant Garamond', 'Cinzel', serif" font-size="150" font-weight="700" letter-spacing="8" fill="#FFFFFF">
      NST
    </text>
    
    <!-- "S T U D I O" in tracked uppercase from guide -->
    <text x="6" y="202" font-family="'Satoshi', sans-serif" font-size="34" font-weight="400" letter-spacing="24" fill="#F9F9F9">
      STUDIO
    </text>

    <!-- Tagline: The Storytelling Studio -->
    <text x="8" y="242" font-family="'Poppins', sans-serif" font-size="15" font-weight="500" letter-spacing="6" fill="#FF2222">
      THE STORYTELLING STUDIO
    </text>
  </g>
</svg>
