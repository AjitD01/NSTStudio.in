<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <radialGradient id="emblemGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2A1015" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#121216" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#08080A" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5DC" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#8C6E1A" />
      <stop offset="100%" stop-color="#E5C158" />
    </linearGradient>
    <filter id="crimsonPulse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Luxury Medallion Rings -->
  <circle cx="160" cy="160" r="154" fill="none" stroke="url(#goldBorder)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
  <circle cx="160" cy="160" r="146" fill="url(#emblemGlow)" stroke="url(#goldBorder)" stroke-width="2" />
  <circle cx="160" cy="160" r="141" fill="none" stroke="#E63946" stroke-width="0.8" opacity="0.4" />

  <!-- The Storyteller, Dog, and Flute -->
  <g transform="translate(18, 18) scale(0.9)">
    <!-- Film Reel Bubble -->
    <g transform="translate(95, 20)">
      <polygon points="12,42 0,55 24,47" fill="#FFFFFF" />
      <circle cx="28" cy="24" r="26" fill="#FFFFFF" />
      <circle cx="28" cy="24" r="4.5" fill="#08080A" />
      <circle cx="28" cy="9" r="4.5" fill="#08080A" />
      <circle cx="42" cy="19" r="4.5" fill="#08080A" />
      <circle cx="37" cy="35" r="4.5" fill="#08080A" />
      <circle cx="19" cy="35" r="4.5" fill="#08080A" />
      <circle cx="14" cy="19" r="4.5" fill="#08080A" />
    </g>

    <!-- Stylized Hat / Head -->
    <path d="M 180 50 Q 200 40 215 54 L 195 90 L 180 82 Z" fill="#FFFFFF" />
    <path d="M 186 48 C 178 40 168 44 165 52 C 172 52 178 50 186 48 Z" fill="#FFFFFF" />

    <!-- Red Flute -->
    <polygon points="102,135 212,85 215,88 104,140" fill="#E63946" filter="url(#crimsonPulse)" />
    <path d="M 118 134 L 115 156 M 120 135 L 126 154" stroke="#E63946" stroke-width="2.5" stroke-linecap="round" />

    <!-- Arms -->
    <path d="M 190 98 L 155 125 L 165 132 L 188 112 Z" fill="#FFFFFF" />
    <path d="M 172 120 L 140 137 L 150 148 L 178 130 Z" fill="#FFFFFF" />

    <!-- Torso -->
    <polygon points="195,95 210,140 185,155 175,108" fill="#FFFFFF" />

    <!-- Legs sitting dynamically -->
    <polygon points="175,150 140,205 152,212 188,162" fill="#FFFFFF" />
    <polygon points="188,155 240,188 232,198 178,166" fill="#FFFFFF" />
    <polygon points="140,205 110,225 120,230 152,212" fill="#FFFFFF" />
    <polygon points="240,188 270,225 258,230 230,196" fill="#FFFFFF" />

    <!-- Rock/Mound Base -->
    <polygon points="90,228 140,220 180,228 220,210 260,228 280,234 265,245 200,240 140,248 80,238" fill="#FFFFFF" />

    <!-- Dog Companion -->
    <g transform="translate(56, 172)">
      <path d="M 28 28 C 30 20 38 18 45 22 C 50 25 54 32 48 35 C 44 38 40 35 36 40 L 30 46 Z" fill="#FFFFFF" />
      <path d="M 28 24 L 22 18 L 26 26 Z" fill="#FFFFFF" />
      <path d="M 32 42 C 25 45 15 52 18 62 C 22 72 32 70 42 66 C 36 60 38 52 44 48 Z" fill="#FFFFFF" />
      <path d="M 16 58 C 8 52 4 44 8 40 C 12 38 15 42 16 48 Z" fill="#FFFFFF" />
    </g>
  </g>
</svg>
